seed: 42
device: cuda:0
num_steps_per_env: 64
init_at_random_ep_len: true
max_iterations: 50
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: 1.0
check_for_nan: true
save_interval: 50
experiment_name: hexapod_walk
run_name: hexapod_walk
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.2
    std_type: log
    std_range: !!python/tuple
    - 0.05
    - 0.3
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 8
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.995
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  use_mixed_precision: false
  rnd_cfg: null
  symmetry_cfg: null
torch_compile_mode: null
policy: {}
