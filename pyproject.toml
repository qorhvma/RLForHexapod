[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "RLforHexapod"
version = "0.1.0"
description = "Isaac Lab environments for RLforHexapod."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hyperism" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab==3.0.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.entry-points."isaaclab.tasks"]
RLforHexapod = "RLforHexapod.tasks"

[project.optional-dependencies]
isaacsim = ["isaacsim[all,extscache]==6.2.0.0", "PyJWT[crypto]>=2.15.1,<3"]
leapp = ["leapp==0.7.2"]
ovphysx = ["ovphysx"]
ovrtx = ["ovrtx==0.5.0.377615", "ovstage==0.1.1.355824"]
video = ["isaaclab[video]"]
# Temporary compatibility pin: Isaac Lab's logger calls wandb.util.generate_id,
# which W&B 0.31.0 no longer provides. Remove after that logger is updated.
wandb = ["isaaclab[wandb]", "wandb==0.26.1"]

[dependency-groups]
dev = ["codespell>=2.4", "pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
isaaclab = { git = "https://github.com/isaac-sim/IsaacLab.git", branch = "release/3.0.0", subdirectory = "tools/wheel_builder" }
ovphysx = { index = "nvidia" }
ovrtx = { index = "nvidia" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.build-backend]
module-name = "RLforHexapod"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["RLforHexapod"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", "**/logs", ".git", ".venv", ".vscode"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: test exercises isolated logic and does not launch the simulator",
    "integration: test drives the simulator/scene/environment end-to-end",
    "smoke: tests for core installation, task, and RL functionality",
    "kitless: test must pass inside the Kit-less container, which has no Isaac Sim runtime",
]

[tool.codespell]
skip = "*.usd,*.usda,*.usdc,*.json,*.onnx,*.pt,*.mp4,*.data,uv.lock,logs"
